apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsentinel-web
  namespace: finsentinel
spec:
  replicas: 2
  selector:
    matchLabels: { app: finsentinel-web }
  template:
    metadata:
      labels: { app: finsentinel-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/your-github-user/finsentinel-web:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: finsentinel-web
  namespace: finsentinel
spec:
  selector: { app: finsentinel-web }
  ports:
    - port: 80
      targetPort: 3000
