apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finsentinel.fullname" . }}-api

spec:
  replicas: {{ .Values.api.replicas }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: finsentinel-api

  template:
    metadata:
      labels:
        app: finsentinel-api

    spec:
      serviceAccountName: {{ include "finsentinel.serviceAccount" . }}
      terminationGracePeriodSeconds: 30

      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: {{ include "finsentinel.fullname" . }}-api-config

          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup }}
              port: http
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness }}
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness }}
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 5

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
{{ toYaml .Values.api.resources | indent 12 }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "finsentinel.fullname" . }}-api

spec:
  type: {{ .Values.api.service.type }}

  selector:
    app: finsentinel-api

  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http

      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
