{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finsentinel.fullname" . }}-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finsentinel
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: finsentinel
      ports:
        - protocol: TCP
          port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "finsentinel.fullname" . }}-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: finsentinel
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
{{- end }}
